总营收_环形图标 =

VAR totalFmt = FORMAT(total, "#,0")
VAR a =
"<div style='

    min-height:64px;
    background:#142436;

    border-radius:8px;
    font-family:Segoe UI,sans-serif;
    padding:20px 10px 4px 10px;
    margin:0;
    box-sizing:border-box;
    overflow:hidden;
    text-align:center;
'>"
    &
    "<div style='display:inline-block;vertical-align:middle;margin:0;padding:0;'>"
        &
        "<svg width='30' height='30' viewBox='0 0 32 32' xmlns='http://www.w3.org/2000/svg' aria-label='总营收增长'
            style='display:inline-block;vertical-align:middle;margin:0 10px 0 0;padding:0;'>

            <path d='M16 5A11 11 0 1 1 8.2 24.2' fill='none' stroke='#378ADD' stroke-width='4' stroke-linecap='round' />

        &
        "<div style='display:inline-block;vertical-align:middle;text-align:left;margin:0;padding:0;white-space:nowrap;'>

                & totalFmt
                & "</div>
        </div>"
        &
        "</div>
</div>"
RETURN
a
