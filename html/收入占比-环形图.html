<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>收入占比</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #142436;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .chart-card {
      width: 520px;
      background: #142436;
      border-radius: 12px;
      padding: 28px 32px 32px;
    }
    .chart-header {
      margin-bottom: 18px;
    }
    .chart-title {
      font-size: 18px;
      font-weight: 600;
      color: #ffffff;
      line-height: 1.4;
    }
    .chart-subtitle {
      font-size: 13px;
      color: #B4B2A9;
      margin-top: 4px;
    }
    .chart-body {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .chart-area {
      position: relative;
      width: 260px;
      height: 260px;
    }
    .chart-area svg {
      width: 100%;
      height: 100%;
    }
    .legend {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-left: 12px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: #E8E8E8;
    }
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="chart-card">
    <div class="chart-header">
      <div class="chart-title">收入占比</div>
      <div class="chart-subtitle">星图、MCN、猿推库 和 智趣</div>
    </div>
    <div class="chart-body">
      <div class="chart-area">
        <svg viewBox="0 0 260 260">
          <!-- 4 slices -->
          <g id="donut-slices"></g>
          <!-- labels -->
          <g id="donut-labels"></g>
        </svg>
      </div>
      <div class="legend" id="legend"></div>
    </div>
  </div>

  <script>
    const data = [
      { name: '星图', value: 610304, color: '#378ADD' },
      { name: 'MCN', value: 256719, color: '#2D6BC9' },
      { name: '猿推库', value: 83153, color: '#5DCAA5' },
      { name: '智趣', value: 44824, color: '#C4A77D' }
    ];

    const total = data.reduce((sum, d) => sum + d.value, 0);
    data.forEach(d => {
      d.percent = d.value / total;
      d.percentText = (d.percent * 100).toFixed(d.percent < 0.1 ? 2 : 1) + '%';
    });

    const cx = 130, cy = 130, radius = 90, innerRadius = 58;
    const slicesGroup = document.getElementById('donut-slices');
    const labelsGroup = document.getElementById('donut-labels');
    const legend = document.getElementById('legend');

    let startAngle = -Math.PI / 2; // start from top

    function arcPath(start, end, r, innerR) {
      const x1 = cx + r * Math.cos(start);
      const y1 = cy + r * Math.sin(start);
      const x2 = cx + r * Math.cos(end);
      const y2 = cy + r * Math.sin(end);
      const x3 = cx + innerR * Math.cos(end);
      const y3 = cy + innerR * Math.sin(end);
      const x4 = cx + innerR * Math.cos(start);
      const y4 = cy + innerR * Math.sin(start);
      const largeArc = (end - start) > Math.PI ? 1 : 0;
      return `M ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2} L ${x3} ${y3} A ${innerR} ${innerR} 0 ${largeArc} 0 ${x4} ${y4} Z`;
    }

    data.forEach((d, i) => {
      const sweep = d.percent * Math.PI * 2;
      const endAngle = startAngle + sweep;

      // slice
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', arcPath(startAngle, endAngle, radius, innerRadius));
      path.setAttribute('fill', d.color);
      slicesGroup.appendChild(path);

      // label with leader line for slices > 4%
      if (d.percent > 0.04) {
        const midAngle = startAngle + sweep / 2;
        const labelR = radius + 24;
        const lx = cx + labelR * Math.cos(midAngle);
        const ly = cy + labelR * Math.sin(midAngle);
        const edgeX = cx + radius * Math.cos(midAngle);
        const edgeY = cy + radius * Math.sin(midAngle);

        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', edgeX);
        line.setAttribute('y1', edgeY);
        line.setAttribute('x2', lx);
        line.setAttribute('y2', ly);
        line.setAttribute('stroke', '#B4B2A9');
        line.setAttribute('stroke-width', '1');
        labelsGroup.appendChild(line);

        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', lx);
        text.setAttribute('y', ly);
        text.setAttribute('fill', '#ffffff');
        text.setAttribute('font-size', '12');
        text.setAttribute('font-weight', '500');
        text.setAttribute('text-anchor', midAngle > Math.PI / 2 && midAngle < 3 * Math.PI / 2 ? 'end' : 'start');
        text.setAttribute('dominant-baseline', 'middle');
        text.textContent = `${d.value.toLocaleString()} (${d.percentText})`;
        labelsGroup.appendChild(text);
      }

      startAngle = endAngle;

      // legend
      const item = document.createElement('div');
      item.className = 'legend-item';
      item.innerHTML = `<div class="legend-dot" style="background:${d.color}"></div><span>${d.name}</span>`;
      legend.appendChild(item);
    });
  </script>
</body>
</html>
