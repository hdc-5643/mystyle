<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>营收分析 · 分渠道毛利率（效果图）</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', 'PingFang SC', sans-serif;
      background: #0A1428;
      color: #FFFFFF;
      font-size: 13px;
      line-height: 1.5;
      padding: 32px;
    }
    .canvas {
      width: 480px;
      margin: 0 auto;
    }

    /* ============ 卡片 ============ */
    .card {
      background: #142436;
      border: 0.5px solid #2C4A6B;
      border-radius: 8px;
      padding: 18px 20px;
    }
    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .card-title { font-size: 14px; font-weight: 500; color: #FFFFFF; }
    .action {
      height: 22px; padding: 0 14px; border-radius: 4px;
      background: #0F1B30; border: 0.5px solid #378ADD; color: #378ADD;
      font-size: 11px; line-height: 21px; font-weight: 500;
      cursor: pointer; transition: all .15s;
    }
    .action:hover { background: #378ADD; color: #FFFFFF; }

    /* ============ 顶部 4 个汇总 ============ */
    .summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }
    .sum-cell {
      background: #0F1B30;
      border-radius: 6px;
      padding: 10px 12px;
    }
    .sum-label {
      font-size: 11px; color: #B4B2A9;
      margin-bottom: 6px;
    }
    .sum-value {
      font-size: 16px; font-weight: 500; color: #FFFFFF;
    }
    .sum-value.green { color: #5DCAA5; }
    .sum-value.red   { color: #F0997B; }
    .sum-value.muted { color: #B4B2A9; }

    /* ============ 图例 ============ */
    .legend {
      display: flex; gap: 14px;
      font-size: 10px; color: #B4B2A9;
      margin-bottom: 14px;
      align-items: center;
    }
    .legend-dot {
      display: inline-block; width: 8px; height: 8px;
      border-radius: 2px; margin-right: 5px;
      vertical-align: middle;
    }

    /* ============ 条形图行 ============ */
    .bars { display: flex; flex-direction: column; gap: 14px; }
    .bar-row {
      display: grid;
      grid-template-columns: 110px 1fr 80px;
      align-items: center;
      gap: 12px;
    }
    .bar-name { display: flex; flex-direction: column; }
    .bar-name strong { font-size: 12px; font-weight: 500; color: #FFFFFF; }
    .bar-name span  { font-size: 10px; color: #B4B2A9; margin-top: 2px; }

    .bar-track {
      height: 14px; background: #0F1B30;
      border-radius: 3px; overflow: hidden;
      position: relative;
    }
    .bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width .8s ease;
    }

    .bar-value {
      text-align: right;
      font-size: 14px; font-weight: 500;
    }
    .bar-value .delta {
      display: block;
      font-size: 10px;
      font-weight: 400;
      margin-top: 2px;
    }

    /* ============ 脚注 ============ */
    .footnote {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 0.5px solid #1E3A5F;
      font-size: 10px; color: #5F5E5A;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="card">
      <!-- 头 -->
      <div class="card-head">
        <div class="card-title">分渠道毛利率</div>
        <div class="action" onclick="goDetail()">详情 →</div>
      </div>

      <!-- 汇总 -->
      <div class="summary">
        <div class="sum-cell">
          <div class="sum-label">综合毛利率</div>
          <div class="sum-value">26.8<span style="font-size:11px;">%</span></div>
        </div>
        <div class="sum-cell">
          <div class="sum-label">高毛利渠道</div>
          <div class="sum-value green">2</div>
        </div>
        <div class="sum-cell">
          <div class="sum-label">低毛利预警</div>
          <div class="sum-value red">1</div>
        </div>
        <div class="sum-cell">
          <div class="sum-label">加权毛利额</div>
          <div class="sum-value muted">¥26.7<span style="font-size:11px;">万</span></div>
        </div>
      </div>

      <!-- 图例 -->
      <div class="legend">
        <span><i class="legend-dot" style="background:#5DCAA5"></i>≥30% 高毛利</span>
        <span><i class="legend-dot" style="background:#EF9F27"></i>20-30% 中等</span>
        <span><i class="legend-dot" style="background:#F0997B"></i>&lt;20% 预警</span>
      </div>

      <!-- 条形 -->
      <div class="bars">
        <!-- 1. 星图 - 38% 高毛利 -->
        <div class="bar-row">
          <div class="bar-name">
            <strong>星图</strong>
            <span>营收 ¥61.0万</span>
          </div>
          <div class="bar-track">
            <div class="bar-fill" style="width:38%; background:#5DCAA5;"></div>
          </div>
          <div class="bar-value" style="color:#5DCAA5;">
            38.2%
            <span class="delta" style="color:#5DCAA5;">↑ +2.1pp</span>
          </div>
        </div>

        <!-- 2. 智趣服务费 - 32% 高毛利 -->
        <div class="bar-row">
          <div class="bar-name">
            <strong>智趣服务费</strong>
            <span>营收 ¥4.5万</span>
          </div>
          <div class="bar-track">
            <div class="bar-fill" style="width:32%; background:#5DCAA5;"></div>
          </div>
          <div class="bar-value" style="color:#5DCAA5;">
            32.5%
            <span class="delta" style="color:#5DCAA5;">↑ +0.8pp</span>
          </div>
        </div>

        <!-- 3. MCN佣金 - 24% 中等 -->
        <div class="bar-row">
          <div class="bar-name">
            <strong>MCN佣金</strong>
            <span>营收 ¥25.7万</span>
          </div>
          <div class="bar-track">
            <div class="bar-fill" style="width:24%; background:#EF9F27;"></div>
          </div>
          <div class="bar-value" style="color:#EF9F27;">
            24.1%
            <span class="delta" style="color:#F0997B;">↓ -1.5pp</span>
          </div>
        </div>

        <!-- 4. 猿推库服务费 - 14% 预警 -->
        <div class="bar-row">
          <div class="bar-name">
            <strong>猿推库服务费</strong>
            <span>营收 ¥8.3万</span>
          </div>
          <div class="bar-track">
            <div class="bar-fill" style="width:14%; background:#F0997B;"></div>
          </div>
          <div class="bar-value" style="color:#F0997B;">
            14.0%
            <span class="delta" style="color:#F0997B;">↓ -3.2pp</span>
          </div>
        </div>
      </div>

      <!-- 脚注 -->
      <div class="footnote">
        注：毛利率 = (收入 − 成本) ÷ 收入；成本含渠道分成、平台费、退款；pp = 百分点。
      </div>
    </div>
  </div>

  <script>
    // 详情按钮 → 壳层 postMessage（本地预览阶段弹 alert 显示 payload）
    function goDetail() {
      var msg = { type: 'navigate', page: 'channel-gross-margin', tab: 'all' };
      try { window.top.postMessage(msg, '*'); }
      catch (e) {
        alert('跳转消息已发出（本地预览）：\n' + JSON.stringify(msg, null, 2));
      }
    }
  </script>
</body>
</html>
