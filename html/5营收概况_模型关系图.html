<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5.营收概况 — 模型关系图</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0A1428;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 32px 24px;
    font-family: "Segoe UI", -apple-system, "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    color: #FFFFFF;
  }
  .wrap { max-width: 1100px; width: 100%; }
  h1 { color: #FFFFFF; font-size: 18px; font-weight: 500; margin: 0 0 4px; }
  .sub { color: #B4B2A9; font-size: 13px; margin: 0 0 20px; line-height: 1.6; }
  svg { width: 100%; height: auto; display: block; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; font-weight: 400; }
  .node.c-blue rect { fill: #0C447C; stroke: #378ADD; stroke-width: 1; }
  .node.c-purple rect { fill: #3C3489; stroke: #7F77DD; stroke-width: 1; }
  .node.c-gray rect { fill: #142436; stroke: #2C4A6B; stroke-width: 1; }
  .node.c-blue .th { fill: #FFFFFF; }
  .node.c-blue .ts { fill: #B5D4F4; }
  .node.c-purple .th { fill: #FFFFFF; }
  .node.c-purple .ts { fill: #CECBF6; }
  .node.c-gray .th { fill: #FFFFFF; }
  .node.c-gray .ts { fill: #B4B2A9; }
  text { fill: #B4B2A9; }
</style>
</head>
<body>
<div class="wrap">
  <h1>5.营收概况 — 模型关系图</h1>
  <p class="sub">4 个业务表（猿推库团长订单 / 智趣团长订单 / 星图提报管理 / MCN）各自连到日期表-结算 与 日期表-支付，均为多对一单向筛选。</p>
  <svg viewBox="0 0 680 360" width="100%" role="img">
    <title>5.营收概况 模型关系图</title>
    <desc>4 个业务表各自连到日期表-结算和日期表-支付两个日期维度表，均为多对一单向筛选。</desc>
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>

    <g class="node c-blue">
      <rect x="100" y="40" width="180" height="56" rx="8"/>
      <text class="th" x="190" y="62" text-anchor="middle" dominant-baseline="central">日期表-结算</text>
      <text class="ts" x="190" y="80" text-anchor="middle" dominant-baseline="central">日期维度</text>
    </g>

    <g class="node c-purple">
      <rect x="400" y="40" width="180" height="56" rx="8"/>
      <text class="th" x="490" y="62" text-anchor="middle" dominant-baseline="central">日期表-支付</text>
      <text class="ts" x="490" y="80" text-anchor="middle" dominant-baseline="central">日期维度</text>
    </g>

    <g class="node c-gray">
      <rect x="20" y="230" width="140" height="56" rx="8"/>
      <text class="th" x="90" y="252" text-anchor="middle" dominant-baseline="central">猿推库团长订单</text>
      <text class="ts" x="90" y="270" text-anchor="middle" dominant-baseline="central">业务表</text>
    </g>
    <g class="node c-gray">
      <rect x="180" y="230" width="140" height="56" rx="8"/>
      <text class="th" x="250" y="252" text-anchor="middle" dominant-baseline="central">智趣团长订单</text>
      <text class="ts" x="250" y="270" text-anchor="middle" dominant-baseline="central">业务表</text>
    </g>
    <g class="node c-gray">
      <rect x="360" y="230" width="140" height="56" rx="8"/>
      <text class="th" x="430" y="252" text-anchor="middle" dominant-baseline="central">星图提报管理</text>
      <text class="ts" x="430" y="270" text-anchor="middle" dominant-baseline="central">业务表</text>
    </g>
    <g class="node c-gray">
      <rect x="520" y="230" width="140" height="56" rx="8"/>
      <text class="th" x="590" y="252" text-anchor="middle" dominant-baseline="central">MCN</text>
      <text class="ts" x="590" y="270" text-anchor="middle" dominant-baseline="central">业务表</text>
    </g>

    <path d="M90 230 C90 163, 160 163, 160 96" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M250 230 C250 163, 190 163, 190 96" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M430 230 C430 163, 220 163, 220 96" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M590 230 C590 163, 250 163, 250 96" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>

    <path d="M90 230 C90 163, 430 163, 430 96" fill="none" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M250 230 C250 163, 460 163, 460 96" fill="none" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M430 230 C430 163, 490 163, 490 96" fill="none" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M590 230 C590 163, 520 163, 520 96" fill="none" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arrow)"/>

    <g transform="translate(40, 326)">
      <line x1="0" y1="0" x2="24" y2="0" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>
      <text class="ts" x="32" y="0" dominant-baseline="central">连日期表-结算（结算/激活日期）</text>
      <line x1="290" y1="0" x2="314" y2="0" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arrow)"/>
      <text class="ts" x="322" y="0" dominant-baseline="central">连日期表-支付（支付/激活日期）</text>
    </g>
  </svg>
</div>
</body>
</html>
