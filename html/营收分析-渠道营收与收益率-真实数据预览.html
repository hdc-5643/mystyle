<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>渠道营收与收益率 - 真实数据预览</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0A1428; font-family:'Segoe UI',sans-serif; color:#FFFFFF; display:flex; justify-content:center; padding:24px; }
  .card { width:100%; max-width:560px; background:#142436; border:0.5px solid #2C4A6B; border-radius:8px; color:#FFFFFF; padding:18px 20px; }
  .card-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .card-title { font-size:14px; font-weight:500; }
  .btn-detail { height:22px; padding:0 14px; border-radius:4px; background:#0F1B30; border:0.5px solid #378ADD; color:#378ADD; font-size:11px; line-height:21px; font-weight:500; cursor:pointer; }
  .legend { display:flex; gap:18px; font-size:10px; color:#B4B2A9; margin-bottom:10px; align-items:center; }
  .legend i { display:inline-block; margin-right:5px; vertical-align:middle; }
  .chart-area { background:#0F1B30; border-radius:6px; padding:12px 8px 8px 8px; }
  .x-labels { display:flex; justify-content:space-around; padding:8px 8px 0 8px; font-size:10px; color:#B4B2A9; }
  .x-labels > div { text-align:center; flex:1; }
  .x-labels strong { display:block; font-size:11px; font-weight:500; color:#FFFFFF; margin-bottom:2px; }
  .x-labels span { font-size:9px; color:#5F5E5A; }
  .caveat { background:#1A2D44; border-left:2px solid #7F77DD; padding:8px 10px; border-radius:0 4px 4px 0; margin:14px 0 10px 0; font-size:10px; color:#B4B2A9; line-height:1.6; }
  .data-note { background:#1A2D44; border-left:2px solid #EF9F27; padding:8px 10px; border-radius:0 4px 4px 0; margin:0 0 10px 0; font-size:10px; color:#B4B2A9; line-height:1.6; }
</style>
</head>
<body>
<div class="card">
  <div class="card-head">
    <div class="card-title">渠道营收与收益率</div>
    <div class="btn-detail">详情 →</div>
  </div>

  <div class="data-note">
    <strong style="color:#EF9F27;">⚠️ 数据落差提示：</strong>星图营收 1902 万 ≈ MCN(95万) 的 20 倍。线性轴下 MCN/猿推库/智趣柱高仅 2~8px，几乎不可见。建议考虑：①对数轴 ②分面小图 ③排除星图单独展示。
  </div>

  <div class="legend">
    <span><i style="width:10px;height:10px;border-radius:2px;background:#378ADD;"></i>营收(万)</span>
    <span><i style="width:8px;height:8px;border-radius:50%;background:#5DCAA5;"></i>毛利率</span>
    <span><i style="width:8px;height:8px;border-radius:50%;background:#378ADD;"></i>佣金率</span>
    <span><i style="width:8px;height:8px;border-radius:50%;background:#EF9F27;"></i>服务费率</span>
  </div>

  <div class="chart-area">
    <svg viewBox="0 0 480 260" xmlns="http://www.w3.org/2000/svg" style="display:block;width:100%;height:240px;">
      <!-- 网格线 -->
      <line x1="60" y1="20"  x2="440" y2="20"  stroke="#1E3A5F" stroke-width="0.5"/>
      <line x1="60" y1="56"  x2="440" y2="56"  stroke="#1E3A5F" stroke-width="0.5"/>
      <line x1="60" y1="92"  x2="440" y2="92"  stroke="#1E3A5F" stroke-width="0.5"/>
      <line x1="60" y1="128" x2="440" y2="128" stroke="#1E3A5F" stroke-width="0.5"/>
      <line x1="60" y1="164" x2="440" y2="164" stroke="#1E3A5F" stroke-width="0.5"/>
      <line x1="60" y1="200" x2="440" y2="200" stroke="#2C4A6B" stroke-width="1"/>

      <!-- 左 Y 轴标签 (maxRev=2200) -->
      <text x="54" y="24"  text-anchor="end" font-size="9" fill="#5F5E5A">2200</text>
      <text x="54" y="60"  text-anchor="end" font-size="9" fill="#5F5E5A">1760</text>
      <text x="54" y="96"  text-anchor="end" font-size="9" fill="#5F5E5A">1320</text>
      <text x="54" y="132" text-anchor="end" font-size="9" fill="#5F5E5A">880</text>
      <text x="54" y="168" text-anchor="end" font-size="9" fill="#5F5E5A">440</text>
      <text x="54" y="204" text-anchor="end" font-size="9" fill="#5F5E5A">0</text>
      <text x="8" y="110" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#378ADD" transform="rotate(-90,8,110)">营收(万)</text>

      <!-- 右 Y 轴标签 (maxRate=60%) -->
      <text x="446" y="24"  font-size="9" fill="#5F5E5A">60%</text>
      <text x="446" y="60"  font-size="9" fill="#5F5E5A">48%</text>
      <text x="446" y="96"  font-size="9" fill="#5F5E5A">36%</text>
      <text x="446" y="132" font-size="9" fill="#5F5E5A">24%</text>
      <text x="446" y="168" font-size="9" fill="#5F5E5A">12%</text>
      <text x="446" y="204" font-size="9" fill="#5F5E5A">0%</text>
      <text x="466" y="110" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#F0997B" transform="rotate(90,466,110)">占比</text>

      <!-- 星图: bar h=155.66, y=44.34; scatter y=42.01 (毛利率 52.66%, green) -->
      <rect x="82"  y="44.34"  width="50" height="155.66" rx="2" fill="#378ADD" opacity="0.85"/>
      <text x="107" y="38.34"  text-anchor="middle" font-size="10" font-weight="500" fill="#FFFFFF">1902.5</text>
      <circle cx="107" cy="42.01"  r="5" fill="#5DCAA5" stroke="#0F1B30" stroke-width="1.5"/>
      <text x="107" y="32.01"  text-anchor="middle" font-size="10" font-weight="500" fill="#5DCAA5">52.7%</text>

      <!-- MCN: bar h=7.75, y=192.25; scatter y=183.95 (佣金率 5.35%, blue) -->
      <rect x="177" y="192.25" width="50" height="7.75"  rx="2" fill="#378ADD" opacity="0.85"/>
      <text x="202" y="186.25" text-anchor="middle" font-size="10" font-weight="500" fill="#FFFFFF">94.7</text>
      <circle cx="202" cy="183.95" r="5" fill="#378ADD" stroke="#0F1B30" stroke-width="1.5"/>
      <text x="202" y="173.95" text-anchor="middle" font-size="10" font-weight="500" fill="#378ADD">5.4%</text>

      <!-- 猿推库: bar h=3.14, y=196.86; scatter y=196.37 (服务费率 1.21%, orange) -->
      <rect x="272" y="196.86" width="50" height="3.14"  rx="2" fill="#378ADD" opacity="0.85"/>
      <text x="297" y="190.86" text-anchor="middle" font-size="10" font-weight="500" fill="#FFFFFF">38.3</text>
      <circle cx="297" cy="196.37" r="5" fill="#EF9F27" stroke="#0F1B30" stroke-width="1.5"/>
      <text x="297" y="186.37" text-anchor="middle" font-size="10" font-weight="500" fill="#EF9F27">1.2%</text>

      <!-- 智趣: bar h=2(min), y=198; scatter y=15(clamped, 服务费率 100% bug, orange) -->
      <rect x="367" y="198"    width="50" height="2"     rx="2" fill="#378ADD" opacity="0.85"/>
      <text x="392" y="192"    text-anchor="middle" font-size="10" font-weight="500" fill="#FFFFFF">19.7</text>
      <circle cx="392" cy="15"     r="5" fill="#EF9F27" stroke="#0F1B30" stroke-width="1.5"/>
      <text x="392" y="5"      text-anchor="middle" font-size="10" font-weight="500" fill="#EF9F27">100.0%</text>
    </svg>
  </div>

  <div class="x-labels">
    <div><strong>星图</strong><span>毛利率</span></div>
    <div><strong>MCN</strong><span>佣金率</span></div>
    <div><strong>猿推库</strong><span>服务费率</span></div>
    <div><strong>智趣</strong><span>服务费率</span></div>
  </div>

  <div class="caveat">
    <strong style="color:#AFA9EC;font-weight:500;">口径提示：</strong>散点为<strong style="color:#AFA9EC;">异构率</strong>（服务费率/佣金率/毛利率定义不同），按性质着色，<strong style="color:#AFA9EC;">不连线、不可跨点比较趋势</strong>。柱高为统一口径的营收金额，可比。
  </div>
</div>
</body>
</html>
