<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>顶栏一行布局 · 标题+页面导航器+切片器</title>
  <style>
    :root {
      --bg-page: #0A1428;
      --bg-topbar: #081426;
      --bg-card: #142436;
      --bg-highlight: #1A2D44;
      --border: #2C4A6B;
      --line: #1E3A5F;
      --text-main: #FFFFFF;
      --text-sub: #B4B2A9;
      --text-muted: #5F5E5A;
      --primary: #7F77DD;
      --primary-hover: #635BC9;
      --primary-soft: rgba(127, 119, 221, 0.12);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg-page);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      padding: 40px;
    }

    .stage { width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

    /* ===== 顶栏：单行（标题 + 页面导航器 + 切片器） ===== */
    .topbar {
      background: var(--bg-topbar);
      border: 1px solid var(--border);
      border-radius: 12px 12px 0 0;
      border-bottom: 1px solid var(--line);
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      gap: 16px;
    }

    /* 区①：标题（左） */
    .zone-title {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex-shrink: 0;
    }
    .zone-title .brand-title { font-size: 19px; font-weight: 700; color: var(--text-main); letter-spacing: 0.5px; }
    .zone-title .brand-sub { font-size: 12px; color: var(--text-muted); }

    /* 区②：页面导航器（中） */
    .zone-nav {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      justify-content: center;
    }
    .nav-tab {
      height: 34px;
      padding: 0 20px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--text-sub);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .nav-tab:hover:not(.active) { color: var(--text-main); background: rgba(255, 255, 255, 0.04); }
    .nav-tab.active { background: var(--primary); color: #FFFFFF; box-shadow: 0 2px 8px rgba(55, 138, 221, 0.25); }

    /* 区③：切片器（右） */
    .zone-slicer {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      color: var(--text-sub);
      font-size: 13px;
    }
    .dropdown {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 32px;
      padding: 0 14px;
      background: var(--bg-highlight);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 13px;
      cursor: pointer;
      transition: border-color 0.2s ease;
    }
    .dropdown:hover { border-color: var(--primary); }
    .dropdown-icon {
      width: 0; height: 0;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 4px solid var(--text-sub);
      margin-top: 2px;
    }

    /* 调试区标记（演示用，可删） */
    .topbar.debug .zone-title,
    .topbar.debug .zone-nav,
    .topbar.debug .zone-slicer {
      outline: 1px dashed rgba(127, 119, 221, 0.5);
      outline-offset: -4px;
      border-radius: 6px;
      height: 56px;
    }
    .zone-tag {
      display: none;
      font-size: 10px;
      color: #AFA9EC;
      margin-bottom: 2px;
    }
    .topbar.debug .zone-tag { display: block; }

    /* ===== 内容区 + 渠道切片器 ===== */
    .content {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 12px 12px;
      padding: 24px;
    }
    .slicer-head { font-size: 13px; color: var(--text-sub); margin-bottom: 12px; }
    .slicer-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .slicer-label { font-size: 13px; color: var(--text-sub); font-weight: 500; }
    .slicer-pills { display: flex; gap: 8px; flex-wrap: wrap; }
    .pill {
      height: 32px; padding: 0 16px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--bg-topbar);
      color: var(--text-sub);
      font-size: 13px; font-weight: 500;
      cursor: pointer; transition: all 0.2s ease;
      display: flex; align-items: center; justify-content: center;
    }
    .pill:hover:not(.active) { border-color: var(--primary); color: var(--text-main); background: var(--primary-soft); }
    .pill.active { background: var(--primary); border-color: var(--primary); color: #FFFFFF; box-shadow: 0 2px 8px rgba(55, 138, 221, 0.22); }

    .hint { margin-top: 18px; font-size: 12px; color: var(--text-muted); line-height: 1.6; }
    .hint b { color: var(--text-sub); font-weight: 600; }
  </style>
</head>
<body>
  <div class="stage">
    <!-- 顶栏：单行三区 -->
    <div class="topbar" id="topbar">
      <!-- 区① 标题 -->
      <div class="zone-title">
        <span class="zone-tag">① 标题</span>
        <div class="brand-title">营收概况</div>
        <div class="brand-sub">Revenue Overview</div>
      </div>
      <!-- 区② 页面导航器 -->
      <div class="zone-nav">
        <span class="zone-tag">② 页面导航器</span>
        <button class="nav-tab active">结算收入</button>
        <button class="nav-tab">支付收入</button>
      </div>
      <!-- 区③ 切片器 -->
      <div class="zone-slicer">
        <span class="zone-tag">③ 切片器</span>
        <span>结算日期</span>
        <div class="dropdown">
          <span>本月</span>
          <div class="dropdown-icon"></div>
        </div>
      </div>
    </div>

    <!-- 内容区 + 渠道切片器 -->
    <div class="content">
      <div class="slicer-head">渠道筛选</div>
      <div class="slicer-row">
        <span class="slicer-label">渠道:</span>
        <div class="slicer-pills">
          <button class="pill active">智趣</button>
          <button class="pill">猿推库</button>
          <button class="pill">MCN</button>
          <button class="pill">星图</button>
        </div>
      </div>
      <div class="hint">
        单行顶栏布局：<b>① 标题（左，固定宽度）</b> → <b>② 页面导航器（居中，flex:1 占满中间）</b> → <b>③ 切片器（右，固定宽度）</b>。<br>
        顶栏高 72px、底色 <b>#0F1B30</b>、下沿 1px <b>#1E3A5F</b>；三区用 flex space-between 排布。点击左侧「调试区标记」复选框可看到三个区的虚线边界。
      </div>
      <label style="display:flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;color:var(--text-sub);cursor:pointer;">
        <input type="checkbox" id="debugToggle"> 显示三区布局边界（调试用）
      </label>
    </div>
  </div>

  <script>
    document.querySelectorAll('.nav-tab, .pill').forEach(btn => {
      btn.addEventListener('click', function () {
        const siblings = this.parentElement.querySelectorAll('.nav-tab, .pill');
        siblings.forEach(s => s.classList.remove('active'));
        this.classList.add('active');
      });
    });
    document.getElementById('debugToggle').addEventListener('change', function () {
      document.getElementById('topbar').classList.toggle('debug', this.checked);
    });
  </script>
</body>
</html>
