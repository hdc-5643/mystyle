<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>营收分析-收入趋势效果图</title>
<style>
  body {
    margin: 0;
    background: #0A1428;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #FFFFFF;
  }
  .container { padding: 24px; }
  .card {
    background: #142436;
    border: 0.5px solid #2C4A6B;
    border-radius: 10px;
    padding: 20px 24px 16px;
    max-width: 760px;
    margin: 0 auto;
  }

  /* === 第 1 行:Tab + 详情按钮 === */
  .header-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
  }
  .tabs { display: flex; gap: 6px; }
  .tab {
    height: 26px;
    padding: 0 14px;
    border-radius: 13px;
    background: transparent;
    border: 1px solid #2C4A6B;
    color: #B4B2A9;
    font-size: 12px;
    line-height: 26px;
    cursor: pointer;
    transition: all 0.15s ease;
    user-select: none;
  }
  .tab:hover { border-color: #378ADD; color: #378ADD; }
  .tab.active {
    background: transparent;
    border: 1px solid #378ADD;
    color: #378ADD;
    font-weight: 500;
  }
  .action-detail {
    margin-left: auto;
    height: 26px;
    padding: 0 16px;
    border-radius: 4px;
    background: transparent;
    border: 1px solid #378ADD;
    color: #378ADD;
    font-size: 12px;
    font-weight: 500;
    line-height: 26px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .action-detail:hover {
    background: #378ADD;
    color: #FFFFFF;
  }

  /* === 第 2 行:标题 + 图例 === */
  .title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .card-title { font-size: 14px; font-weight: 500; color: #FFFFFF; }
  .legend { display: flex; gap: 16px; }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: #B4B2A9;
  }
  .legend-dot { width: 8px; height: 8px; border-radius: 2px; }

  .chart { width: 100%; display: block; }

  /* === 口径提示 === */
  .note {
    margin-top: 14px;
    padding: 10px 14px;
    background: rgba(240, 153, 123, 0.05);
    border-left: 2px solid #F0997B;
    font-size: 11px;
    color: #B4B2A9;
    border-radius: 0 4px 4px 0;
    line-height: 1.6;
  }
  .note strong { color: #F0997B; font-weight: 500; }
  .note code {
    background: #0F1B30;
    padding: 1px 5px;
    border-radius: 3px;
    color: #AFA9EC;
    font-family: "SF Mono", Consolas, monospace;
    font-size: 10px;
  }
</style>
</head>
<body>
<div class="container">
  <div class="card">

    <div class="header-row">
      <div class="tabs" id="tabs">
        <div class="tab active" data-k="fee">服务费</div>
        <div class="tab" data-k="mcn">MCN</div>
        <div class="tab" data-k="xingtu">星图</div>
        <div class="tab" data-k="total">总营收</div>
      </div>
      <button id="detail-btn" class="action-detail" data-page="revenue-detail">详情 →</button>
    </div>

    <div class="title-row">
      <span class="card-title">收入趋势</span>
      <div class="legend">
        <div class="legend-item"><span class="legend-dot" style="background:#378ADD"></span>波推库</div>
        <div class="legend-item"><span class="legend-dot" style="background:#7F77DD"></span>智趣</div>
      </div>
    </div>

    <svg class="chart" viewBox="0 0 660 280" xmlns="http://www.w3.org/2000/svg" role="img">
      <title>收入趋势双线带状图</title>
      <desc>波推库(蓝)与智趣(紫)8月1日至8月11日的收入对比,中间带状填充表示差距</desc>

      <!-- 横向网格 -->
      <line x1="50" y1="40"  x2="640" y2="40"  stroke="#1E3A5F" stroke-width="0.5"/>
      <line x1="50" y1="85"  x2="640" y2="85"  stroke="#1E3A5F" stroke-width="0.5"/>
      <line x1="50" y1="130" x2="640" y2="130" stroke="#1E3A5F" stroke-width="0.5"/>
      <line x1="50" y1="175" x2="640" y2="175" stroke="#1E3A5F" stroke-width="0.5"/>
      <line x1="50" y1="220" x2="640" y2="220" stroke="#1E3A5F" stroke-width="0.5"/>

      <!-- y 轴标签 -->
      <text x="44" y="44"  text-anchor="end" font-size="9" fill="#5F5E5A">3000</text>
      <text x="44" y="89"  text-anchor="end" font-size="9" fill="#5F5E5A">2500</text>
      <text x="44" y="134" text-anchor="end" font-size="9" fill="#5F5E5A">2000</text>
      <text x="44" y="179" text-anchor="end" font-size="9" fill="#5F5E5A">1500</text>
      <text x="44" y="224" text-anchor="end" font-size="9" fill="#5F5E5A">0</text>

      <!-- 纵向月份分隔虚线(8/3, 8/5, 8/7, 8/9) -->
      <line x1="160" y1="40" x2="160" y2="240" stroke="#2C4A6B" stroke-width="0.5" stroke-dasharray="2 3"/>
      <line x1="270" y1="40" x2="270" y2="240" stroke="#2C4A6B" stroke-width="0.5" stroke-dasharray="2 3"/>
      <line x1="380" y1="40" x2="380" y2="240" stroke="#2C4A6B" stroke-width="0.5" stroke-dasharray="2 3"/>
      <line x1="490" y1="40" x2="490" y2="240" stroke="#2C4A6B" stroke-width="0.5" stroke-dasharray="2 3"/>

      <!-- 带状填充(波推库 → 智趣 之间,差距区) -->
      <path d="M50 89 L105 87 L160 94 L215 84 L270 72 L325 63 L380 54 L435 46 L490 41 L545 49 L600 58
               L600 153 L545 136 L490 123 L435 138 L380 155 L325 170 L270 184 L215 192 L160 200 L105 208 L50 217 Z"
            fill="#378ADD" fill-opacity="0.13"/>

      <!-- 波推库线(蓝,主线) -->
      <path d="M50 89 L105 87 L160 94 L215 84 L270 72 L325 63 L380 54 L435 46 L490 41 L545 49 L600 58"
            fill="none" stroke="#378ADD" stroke-width="2" stroke-linejoin="round"/>

      <!-- 智趣线(紫,副线) -->
      <path d="M50 217 L105 208 L160 200 L215 192 L270 184 L325 170 L380 155 L435 138 L490 123 L545 136 L600 153"
            fill="none" stroke="#7F77DD" stroke-width="1.8" stroke-linejoin="round" opacity="0.9"/>

      <!-- 数据点(精简:只画起/末/峰/谷) -->
      <g>
        <circle cx="50"  cy="89"  r="3"   fill="#378ADD"/>
        <circle cx="160" cy="94"  r="3"   fill="#378ADD"/>
        <circle cx="490" cy="41"  r="4.5" fill="#378ADD" stroke="#FFFFFF" stroke-width="1"/>
        <circle cx="600" cy="58"  r="3"   fill="#378ADD"/>

        <circle cx="160" cy="200" r="3"   fill="#7F77DD"/>
        <circle cx="490" cy="123" r="3"   fill="#7F77DD"/>
        <circle cx="600" cy="153" r="3"   fill="#7F77DD"/>
      </g>

      <!-- 关键数据标签 -->
      <g font-family="-apple-system, Segoe UI, Microsoft YaHei, sans-serif">
        <text x="50"  y="80"  font-size="10" fill="#378ADD" text-anchor="middle">2661</text>
        <text x="160" y="85"  font-size="10" fill="#378ADD" text-anchor="middle">2620</text>
        <text x="490" y="31"  font-size="11" font-weight="500" fill="#378ADD" text-anchor="middle">3091</text>
        <text x="600" y="49"  font-size="10" fill="#378ADD" text-anchor="middle">2940</text>

        <text x="490" y="113" font-size="10" fill="#7F77DD" text-anchor="middle">2360</text>
        <text x="600" y="143" font-size="10" fill="#7F77DD" text-anchor="middle">2100</text>
      </g>

      <!-- 差距标注(8/9 峰处) -->
      <g font-family="-apple-system, Segoe UI, Microsoft YaHei, sans-serif">
        <line x1="500" y1="46" x2="500" y2="118" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="1 2"/>
        <text x="506" y="84" font-size="9" fill="#5F5E5A">差距 731</text>
      </g>

      <!-- x 轴日期(紧凑 8/1 格式,每 2 天 1 格) -->
      <g font-family="-apple-system, Segoe UI, Microsoft YaHei, sans-serif" font-size="10" fill="#5F5E5A" text-anchor="middle">
        <text x="50"  y="255">8/1</text>
        <text x="160" y="255">8/3</text>
        <text x="270" y="255">8/5</text>
        <text x="380" y="255">8/7</text>
        <text x="490" y="255">8/9</text>
        <text x="600" y="255">8/11</text>
      </g>
    </svg>

    <div class="note">
      <strong>⚠️ 口径提示:</strong>
      当前 Tab 维度(<code>计费类型:服务费/MCN/星图/总营收</code>)与图例维度(<code>业务线:波推库/智趣</code>)不在同一层。
      服务费 Tab 激活时,图里却在画"波推库 vs 智趣",读者会懵。<br>
      <strong>解法 A(推荐):</strong>Tab 改为 <code>波推库 / 智趣 / 合计</code>,与图例对齐;<br>
      <strong>解法 B:</strong>Tab 保留计费类型,图例改为 <code>服务费 / 激活金额</code>(但带状对比这层意思就没了)。<br>
      拍板后我把对应解法直接落到代码里。
    </div>

  </div>
</div>

<script>
  // Tab 切换(纯前端样式切换,效果图阶段不接数据)
  document.querySelectorAll('#tabs .tab').forEach(function (t) {
    t.addEventListener('click', function () {
      document.querySelectorAll('#tabs .tab').forEach(function (x) { x.classList.remove('active'); });
      t.classList.add('active');
    });
  });

  // 详情按钮:壳层 postMessage 跳转 + 兜底
  document.getElementById('detail-btn').addEventListener('click', function () {
    var active = document.querySelector('#tabs .tab.active');
    var msg = {
      type: 'navigate',
      page: this.dataset.page,
      tab:  active ? active.dataset.k : ''
    };
    try {
      // 给外壳(React/FastAPI)监听
      window.top.postMessage(msg, '*');
    } catch (e) { /* sandboxed iframe 跨域阻断,走兜底 */ }

    // 兜底:同窗口跳新页(本地预览先注释,避免页面跳走看不清效果)
    // window.top.location.href = '/reports/revenue-detail?tab=' + encodeURIComponent(msg.tab);

    // 备用兜底:新窗口
    // window.open('/reports/revenue-detail?tab=' + encodeURIComponent(msg.tab), '_blank');

    // 本地预览调试:弹个 alert 让你看 postMessage 内容
    console.log('[详情按钮] postMessage:', msg);
    alert(
      '详情按钮已触发\n' +
      'type = ' + msg.type + '\n' +
      'page  = ' + msg.page + '\n' +
      'tab   = ' + msg.tab + '\n\n' +
      '(壳层 FastAPI + React 监听 message 后切换到详情页 / 详情报表)'
    );
  });
</script>
</body>
</html>
