<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>收入趋势 - 布局预览</title>
<style>
  :root{
    --bg:#0A1428;
    --bg-soft:#0D1B2A;
    --card-border:#1E3A5F;
    --accent:#378ADD;
    --accent-2:#1B6FC9;
    --seg-bg:#142436;
    --seg-border:#2C4A6B;
    --text:#FFFFFF;
    --text-dim:#B4B2A9;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);
    font-family:"Segoe UI","Microsoft YaHei",sans-serif;
    color:var(--text);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:24px;
  }
  .report{
    width:960px;
    background:var(--bg);
    border:1px solid var(--card-border);
    border-radius:12px;
    padding:20px 22px 24px;
    box-shadow:0 12px 40px rgba(0,0,0,.45);
  }
  /* 标题行 */
  .header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
  }
  .title{
    font-size:18px;
    font-weight:700;
    letter-spacing:.5px;
  }
  /* 详情主按钮 */
  .btn-detail{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:8px 16px;
    border:none;
    border-radius:8px;
    background:linear-gradient(135deg,var(--accent-2),var(--accent));
    color:#fff;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    box-shadow:0 2px 10px rgba(55,138,221,.35);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn-detail:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(55,138,221,.5);}
  .btn-detail svg{display:block;}
  /* 书签导航器（分段控件外观） */
  .nav{
    display:inline-flex;
    background:rgba(255,255,255,.02);
    border:1px solid var(--seg-border);
    border-radius:8px;
    padding:3px;
    gap:2px;
    margin-bottom:20px;
  }
  .nav button{
    border:none;
    background:transparent;
    color:var(--text-dim);
    font-size:13px;
    padding:7px 18px;
    border-radius:6px;
    cursor:pointer;
    position:relative;
    transition:all .15s ease;
  }
  .nav button:hover{color:var(--text);background:rgba(255,255,255,.04);}
  .nav button.active{
    background:var(--seg-bg);
    color:#fff;
    font-weight:600;
  }
  .nav button.active::after{
    content:"";
    position:absolute;
    left:18px;right:18px;bottom:-3px;
    height:2px;
    border-radius:2px;
    background:var(--accent);
  }
  /* 图表区 */
  .chart{
    background:var(--bg-soft);
    border:1px solid var(--card-border);
    border-radius:8px;
    padding:18px 16px 8px;
    box-shadow:inset 0 1px 6px rgba(0,0,0,.4);
  }
  .chart svg{display:block;width:100%;height:auto;}
</style>
</head>
<body>
  <div class="report">
    <div class="header">
      <div class="title">收入趋势</div>
      <button class="btn-detail">
        详情
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
          <path d="M9 6l6 6-6 6" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <div class="nav">
      <button class="active">服务费</button>
      <button>MCN</button>
      <button>星图</button>
      <button>总营收</button>
    </div>

    <div class="chart">
      <svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#378ADD" stop-opacity="0.45"/>
            <stop offset="100%" stop-color="#378ADD" stop-opacity="0"/>
          </linearGradient>
          <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <!-- 网格 -->
        <g stroke="#B4B2A9" stroke-opacity="0.1" stroke-width="1">
          <line x1="50" y1="60" x2="860" y2="60"/>
          <line x1="50" y1="130" x2="860" y2="130"/>
          <line x1="50" y1="200" x2="860" y2="200"/>
          <line x1="50" y1="270" x2="860" y2="270"/>
        </g>
        <!-- 轴文字 -->
        <g fill="#B4B2A9" font-size="11" font-family="Segoe UI">
          <text x="40" y="64">120</text>
          <text x="40" y="134">80</text>
          <text x="40" y="204">40</text>
          <text x="40" y="274">0</text>
          <text x="60" y="300">1月</text>
          <text x="200" y="300">3月</text>
          <text x="340" y="300">5月</text>
          <text x="480" y="300">7月</text>
          <text x="620" y="300">9月</text>
          <text x="760" y="300">11月</text>
        </g>
        <!-- 面积 -->
        <path d="M60,250 L160,210 L260,230 L360,160 L460,180 L560,120 L660,140 L760,90 L860,110 L860,270 L60,270 Z"
              fill="url(#area)"/>
        <!-- 折线 + 发光 -->
        <path d="M60,250 L160,210 L260,230 L360,160 L460,180 L560,120 L660,140 L760,90 L860,110"
              fill="none" stroke="#378ADD" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
              filter="url(#glow)"/>
        <!-- 数据点 + 标签 -->
        <g fill="#fff" font-size="10" font-family="Segoe UI" text-anchor="middle">
          <circle cx="60" cy="250" r="3.5" fill="#378ADD"/>
          <circle cx="360" cy="160" r="3.5" fill="#378ADD"/>
          <circle cx="560" cy="120" r="3.5" fill="#378ADD"/>
          <circle cx="760" cy="90" r="3.5" fill="#378ADD"/>
          <text x="360" y="148">160</text>
          <text x="560" y="108">120</text>
          <text x="760" y="78">190</text>
        </g>
      </svg>
    </div>
  </div>

<script>
  // 纯前端交互演示：点击导航切换 active 态
  document.querySelectorAll('.nav button').forEach(b=>{
    b.addEventListener('click',()=>{
      document.querySelector('.nav button.active')?.classList.remove('active');
      b.classList.add('active');
    });
  });
</script>
</body>
</html>
